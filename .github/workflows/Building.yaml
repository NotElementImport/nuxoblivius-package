name: Building

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package?'
        default: true
        required: true


jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm start

    - name: Test
      run: npm test

    - name: Publish (only for admin)
      if: github.actor == ${{ secrets.AUTHOR }} && inputs.publish == true
      run: |
        # Publish the package
        npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
        npm publish
